[package]
name = "rho"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = { version = "3.6", features = ["stdio", "unstable_end_turn_token_usage"] }
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "stream", "rustls", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-std", "io-util", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tower-http = { version = "0.7", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
nono = { version = "0.81", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30"
