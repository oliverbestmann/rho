[package]
name = "rho"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = { version = "3.2", features = ["stdio", "unstable_end_turn_token_usage"] }
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "stream", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "fs", "io-std", "io-util", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
nono = { version = "0.79", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
