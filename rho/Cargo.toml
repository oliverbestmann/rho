[package]
name = "rho"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = { version = "3.2", features = ["stdio"] }
anyhow = "1.0.104"
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "fs", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
