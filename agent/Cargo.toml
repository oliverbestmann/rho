[package]
name = "rho-agent"
version = "0.1.0"
edition = "2024"

# The `rho` binary: the rho library plus the extensions below.
[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
rho = { path = "../rho" }
anyhow = "1.0.104"
libc = "0.2"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
