<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a7dff">
<title>rho</title>
<style>
  :root { color-scheme: light dark; --muted: #8889; --line: #8883; --accent: #4a7dff; --err: #e5484d; --bg: Canvas; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; display: flex; height: 100dvh; overflow: hidden; }
  nav { width: 280px; border-right: 1px solid var(--line); overflow-y: auto; flex-shrink: 0; background: var(--bg); }
  nav a { display: block; padding: 10px 12px; color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  nav a.on { background: #4a7dff22; }
  nav a.closed { opacity: .65; }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 12px 4px; }
  nav small, .muted { color: var(--muted); }
  nav small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); min-height: 44px; }
  header #info { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu { display: none; font-size: 20px; background: none; border: 0; color: inherit; padding: 4px 8px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; -webkit-overflow-scrolling: touch; }
  .ev { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { border-left: 3px solid var(--accent); padding-left: 8px; }
  .note { color: var(--muted); font-size: 12px; }
  .thinking { color: var(--muted); font-style: italic; }
  details.tool { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  details.tool summary { cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.tool.err { border-color: var(--err); }
  details.tool pre { font-size: 12px; max-height: 300px; overflow: auto; margin: 4px 0; white-space: pre-wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; flex-shrink: 0; }
  .dot.run { background: #30a46c; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  form { display: flex; gap: 8px; padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  /* 16px keeps iOS from zooming in on focus. */
  textarea { flex: 1; font: inherit; font-size: 16px; min-height: 44px; max-height: 40dvh; resize: vertical; padding: 8px; }
  button { font: inherit; min-width: 64px; }
  #queued { padding: 0 12px; font-size: 13px; }
  #closed { padding: 8px 12px; border-top: 1px solid var(--line); display: none; }
  #auth { padding: 16px 12px; display: none; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line); }
  #auth span { flex-basis: 100%; }
  #auth input { flex: 1; font-size: 16px; padding: 8px; min-width: 0; }
  @media (max-width: 700px) {
    #menu { display: block; }
    nav { position: fixed; inset: 0 auto 0 0; width: 85vw; max-width: 340px; z-index: 2; transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top); }
    body.menu nav { transform: none; box-shadow: 0 0 24px #0005; }
    header #info { white-space: normal; font-size: 14px; }
    body.menu main::after { content: ""; position: fixed; inset: 0; background: #0004; z-index: 1; }
  }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <header><button id="menu" aria-label="Sessions">☰</button><span id="info" class="muted">No session selected</span></header>
  <form id="auth">
    <span id="auth-why"></span>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password from web.json">
    <button>Unlock</button>
  </form>
  <div id="log"></div>
  <div id="queued" class="muted"></div>
  <div id="closed" class="muted">Not open in this rho: read-only. Open it in your editor to continue it.</div>
  <form id="form">
    <textarea id="text" rows="1" placeholder="Message for the agent"></textarea>
    <button>Send</button>
  </form>
</main>
<script>
// Other devices need the password from web.json; it is asked once and kept.
let password = localStorage.getItem("rho-password") || "";

let current = location.hash.slice(1) || null;
let events = [];   // of the current session, by seq
let ticking = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; };
const tokens = (n) => n >= 1000 ? `${Math.round(n / 1000)}k` : `${n}`;
// Input keys shown in a tool summary, the first present one wins (as TITLE_KEYS in rho/src/acp.rs).
const TITLE_KEYS = ["command", "url", "pattern", "glob", "target", "query", "path", "hash", "id", "action", "plan"];
const touch = matchMedia("(hover: none)").matches;

async function api(path, options = {}) {
  const r = await fetch(path, { ...options, headers: { ...(options.headers || {}), "x-rho-password": password } });
  if (r.status === 401) {
    $("auth-why").textContent = await r.text();
    $("auth").style.display = "flex";
    throw new Error("unauthorized");
  }
  $("auth").style.display = "none";
  return r;
}

function entry(s) {
  return `<a href="#${esc(s.id)}" class="${s.id === current ? "on" : ""} ${s.open ? "" : "closed"}">
    <span class="dot ${s.running ? "run" : ""}"></span>${esc(s.title || "Untitled")}
    <small>${esc(s.cwd)}</small>
    <small>${esc(s.profile)} · ${ago(s.updated)}</small>
  </a>`;
}

async function refreshList() {
  const list = await (await api("/api/sessions")).json();
  if (!current && list.length) select(list[0].id);
  const open = list.filter((s) => s.open), stored = list.filter((s) => !s.open);
  $("nav").innerHTML = (open.length ? `<h2>Open here</h2>${open.map(entry).join("")}` : "")
    + (stored.length ? `<h2>Other sessions</h2>${stored.map(entry).join("")}` : "")
    || `<p class="muted" style="padding:12px">No sessions.</p>`;
}

function select(id) {
  current = id;
  events = [];
  $("log").innerHTML = "";
  document.body.classList.remove("menu");
  if (location.hash.slice(1) !== id) location.hash = id;
}

/// One block per event; tool ends fold into their call.
function render() {
  const sorted = [...events].sort((a, b) => a.turn - b.turn || a.slot - b.slot || a.seq - b.seq);
  const tools = new Map();
  for (const e of sorted) {
    if (e.kind === "tool") tools.set(e.id, { ...e });
    if (e.kind === "tool_end") tools.set(e.id, { ...(tools.get(e.id) || { id: e.id, name: e.name, input: e.input }), end: e });
  }
  const html = [];
  const shown = new Set();
  for (const e of sorted) {
    if (e.kind === "user") {
      const note = e.text.startsWith("<system-reminder>");
      html.push(`<div class="ev ${note ? "note" : "user"}">${esc(note ? e.text.replace(/<\/?system-reminder>/g, "").trim() : e.text)}</div>`);
    } else if (e.kind === "assistant") {
      html.push(`<div class="ev">${esc(e.text)}</div>`);
    } else if (e.kind === "thinking") {
      html.push(`<details class="ev thinking"><summary>thinking</summary>${esc(e.text)}</details>`);
    } else if ((e.kind === "tool" || e.kind === "tool_end") && !shown.has(e.id)) {
      shown.add(e.id);
      const t = tools.get(e.id);
      const arg = (t.input && TITLE_KEYS.map((k) => t.input[k]).find((v) => typeof v === "string")) || "";
      const state = !t.end ? "⏳" : t.end.is_error ? "✗" : "✓";
      html.push(`<details class="ev tool ${t.end && t.end.is_error ? "err" : ""}">
        <summary>${state} ${esc(t.name || "")} ${esc(String(arg).split("\n")[0])}</summary>
        <pre>${esc(JSON.stringify(t.input, null, 2))}</pre>
        ${t.end ? `<pre>${esc(t.end.output)}</pre>` : ""}
      </details>`);
    }
  }
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  // Keep open details open across re-renders.
  const open = [...log.querySelectorAll("details")].map((d) => d.open);
  log.innerHTML = html.join("");
  log.querySelectorAll("details").forEach((d, i) => { if (open[i]) d.open = true; });
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function refreshSession() {
  const id = current;
  if (!id) return;
  const r = await api(`/api/sessions/${encodeURIComponent(id)}?since=${events.length}`);
  if (id !== current) return;   // switched meanwhile
  if (!r.ok) { $("info").textContent = "Session not found"; return; }
  const s = await r.json();
  if (id !== current) return;
  $("info").className = "";
  $("info").innerHTML = `<span class="dot ${s.running ? "run" : ""}"></span><b>${esc(s.title || "Untitled")}</b>
    <span class="muted"> · ${esc(s.profile)} · ${s.open ? (s.running ? "working" : "idle") : "not open here"} · ${ago(s.updated)}${s.context ? ` · ${tokens(s.context)} context` : ""}</span>`;
  $("queued").innerHTML = s.queued.map((q) => `<div>⏳ queued: ${esc(q)}</div>`).join("");
  $("form").style.display = s.open ? "flex" : "none";
  $("closed").style.display = s.open ? "none" : "block";
  // The stored history shrank (compaction): start over.
  if (s.total < events.length) { events = []; return; }
  // Only what is new, even if two refreshes overlapped.
  const add = s.events.filter((e) => e.seq >= events.length);
  if (add.length) {
    events.push(...add);
    render();
  }
}

async function tick() {
  if (ticking) return;
  ticking = true;
  try {
    await refreshList();
    await refreshSession();
  } catch (e) {
    if (e.message !== "unauthorized") $("info").textContent = "rho is not reachable";
  } finally {
    ticking = false;
  }
}

window.addEventListener("hashchange", () => { select(location.hash.slice(1)); tick(); });
$("auth").addEventListener("submit", (ev) => {
  ev.preventDefault();
  password = $("password").value;
  localStorage.setItem("rho-password", password);
  $("password").value = "";
  tick();
});
$("menu").addEventListener("click", () => document.body.classList.toggle("menu"));
$("log").addEventListener("click", () => document.body.classList.remove("menu"));

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = $("text").value.trim();
  if (!text || !current) return;
  const r = await api(`/api/sessions/${encodeURIComponent(current)}/send`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (r.ok) $("text").value = "";
  else alert(await r.text());
  tick();
});
// Enter sends on a keyboard; on phones Enter is a new line and the button sends.
$("text").addEventListener("keydown", (ev) => {
  if (!touch && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); }
});
$("text").placeholder = touch
  ? "Message for the agent"
  : "Message for the agent (Enter to send, Shift+Enter for a new line)";

if (current) select(current);
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
